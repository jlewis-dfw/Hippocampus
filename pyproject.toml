[project]
name = "hippocampus"
version = "0.1.0"
description = "Hippocampus core: chunking, incremental diffing, embeddings"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
db = ["psycopg[binary]>=3.2"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
mcp = ["mcp>=1.2,<2"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hippocampus = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
