[project]
name = "hippocampus"
version = "0.1.0"
description = "Hippocampus core: chunking, incremental diffing, embeddings"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
db = ["psycopg[binary]>=3.2"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
mcp = ["mcp>=1.2,<2"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "yamllint>=1.35", "shellcheck-py>=0.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hippocampus = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ideation", "notes", "backlog"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear (likely bugs), UP pyupgrade, RUF100 unused noqa
select = ["E", "F", "W", "I", "B", "UP", "RUF100"]
# E501 (line length) is off: long docstrings and test data are deliberate, and rewrapping them adds churn without finding bugs
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query in a default argument is the framework's idiom, not a mutable-default bug
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
