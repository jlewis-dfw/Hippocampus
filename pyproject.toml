[project]
name = "hippocampus"
version = "0.1.0"
description = "Hippocampus core: chunking, incremental diffing, embeddings"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
db = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
mcp = ["mcp>=1.2,<2"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "coverage>=7", "httpx>=0.27", "ruff>=0.6", "yamllint>=1.35", "shellcheck-py>=0.10", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hippocampus = ["ui/*", "ui/vendor/swagger-ui/*"]

[tool.mypy]
# Starts lenient (the recorded baseline is zero errors) and tightens module by module: the strict list below only grows.
python_version = "3.12"
files = ["src/hippocampus"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# optional extras that are not installed everywhere
module = ["fastembed", "fastembed.*", "playwright", "playwright.*", "psycopg_pool", "psycopg_pool.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# strict modules: small and pure first; add store.py and the routes next
module = ["hippocampus.sync_core", "hippocampus.files_ingest", "hippocampus.diff"]
# what --strict turns on, per module (strict itself is global only)
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]  # tests/e2e starts containers and a browser: run it on purpose (pytest tests/e2e)
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ideation", "notes", "backlog"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear (likely bugs), UP pyupgrade, RUF100 unused noqa
select = ["E", "F", "W", "I", "B", "UP", "RUF100"]
# E501 (line length) is off: long docstrings and test data are deliberate, and rewrapping them adds churn without finding bugs
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query in a default argument is the framework's idiom, not a mutable-default bug
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
