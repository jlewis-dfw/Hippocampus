name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository; it needs no other permission and stores no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hippocampus_test
          POSTGRES_USER: hippo
          POSTGRES_PASSWORD: hippo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hippo -d hippocampus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the changed-files lint needs the history to find the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[db,api,mcp,dev]"
      - name: Lint changed files (fast)
        # pull requests only; the full lint runs again inside the checks below
        if: github.event_name == 'pull_request'
        run: scripts/lint.sh --ci --changed "origin/${{ github.base_ref }}"
      - name: Checks (migrations from zero, tests, dashboard JavaScript)
        env:
          HIPPO_TEST_DSN: postgresql://hippo:hippo@localhost:5432/hippocampus_test
        run: scripts/check.sh --ci
